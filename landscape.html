<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>System Landscape</title>
    <style>
        :root {
            --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
            --bg: #f6f6f4;
            --panel: #fff;
            --ink: #1d1d1b;
            --ink2: #5c5c57;
            --ink3: #8b8b84;
            --line: #dedeD9;
            --line2: #c6c6c0;
            --sel: #185fa5;
            --edge: #0369a1;
            --net: #155e75;
            --fw: #a32d2d;
            --dmz: #b45309;
            --mgmt: #3f4d9c;
            --back: #0f6e56;
            --stor: #7a3b86;
            --shared: #6b21a8;
            --tint: 14%;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #15151a;
                --panel: #1e1e24;
                --ink: #ececea;
                --ink2: #b3b3ae;
                --ink3: #87877f;
                --line: #32323a;
                --line2: #45454f;
                --sel: #85b7eb;
                --edge: #7cc4ea;
                --net: #7fc8de;
                --fw: #f09595;
                --dmz: #f0b356;
                --mgmt: #a9b3f2;
                --back: #67d0ab;
                --stor: #d7a7e0;
                --shared: #d0a9f0;
                --tint: 20%;
            }
        }

        :root[data-theme="dark"] {
            --bg: #15151a;
            --panel: #1e1e24;
            --ink: #ececea;
            --ink2: #b3b3ae;
            --ink3: #87877f;
            --line: #32323a;
            --line2: #45454f;
            --sel: #85b7eb;
            --edge: #7cc4ea;
            --net: #7fc8de;
            --fw: #f09595;
            --dmz: #f0b356;
            --mgmt: #a9b3f2;
            --back: #67d0ab;
            --stor: #d7a7e0;
            --shared: #d0a9f0;
            --tint: 20%;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--sans);
            line-height: 1.45;
            padding: 22px 18px 70px
        }

        .wrap {
            max-width: 1560px;
            margin: 0 auto
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: baseline;
            justify-content: space-between
        }

        h1 {
            font-size: 21px;
            font-weight: 600;
            margin: 0
        }

        .sub {
            font-size: 12.5px;
            color: var(--ink3)
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 14px 0 10px
        }

        button {
            font: inherit;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 7px;
            border: 1px solid var(--line2);
            background: var(--panel);
            color: var(--ink);
            cursor: pointer
        }

        button:hover {
            border-color: var(--ink3)
        }

        button.on {
            background: var(--sel);
            border-color: var(--sel);
            color: #fff
        }

        button.mini {
            padding: 2px 7px;
            font-size: 11px;
            border-radius: 6px
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 11.5px;
            color: var(--ink2);
            margin: 0 0 14px
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 5px
        }

        .err {
            background: color-mix(in srgb, var(--fw) 12%, transparent);
            border: 1px solid color-mix(in srgb, var(--fw) 45%, transparent);
            color: var(--fw);
            padding: 10px 12px;
            border-radius: 9px;
            font-size: 12.5px;
            margin-bottom: 14px
        }

        .err code {
            font-family: var(--mono);
            font-size: 11.5px
        }

        .layout {
            display: grid;
            grid-template-columns:minmax(0, 1fr) 350px;
            gap: 16px;
            align-items: start
        }

        @media (max-width: 1020px) {
            .layout {
                grid-template-columns:1fr
            }
        }

        #canvas {
            position: relative
        }

        #wires, #wires-top {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: visible;
            z-index: 5
        }

        #wires-top {
            z-index: 7
        }

        .band {
            margin-bottom: 14px
        }

        .band .grid2 {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(330px, 1fr));
            gap: 10px
        }

        .sites {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(360px, 1fr));
            gap: 14px
        }

        .site {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 13px
        }

        .site h2 {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 1px
        }

        .site .meta {
            font-size: 11px;
            color: var(--ink3);
            margin-bottom: 11px
        }

        .zone {
            border: 1px solid;
            border-radius: 10px;
            padding: 9px 10px 11px;
            margin-bottom: 9px
        }

        .band .zone {
            margin-bottom: 0
        }

        .zone h3 {
            font-size: 12px;
            font-weight: 600;
            margin: 0 0 7px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }

        .zone .tag {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 400;
            color: var(--ink3)
        }

        .items {
            display: flex;
            flex-wrap: wrap;
            gap: 7px
        }

        .item {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 7px 9px;
            flex: 1 1 150px;
            min-width: 142px;
            cursor: pointer;
            text-align: left;
            color: inherit;
            z-index: 6;
            font: inherit
        }

        .item:hover {
            border-color: var(--ink3)
        }

        .item.sel {
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--sel) 30%, transparent);
            border-color: var(--sel)
        }

        .item.rel {
            border-color: var(--sel)
        }

        .item.dim {
            opacity: .32
        }

        .item .t {
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex: 0 0 auto
        }

        .item .kind {
            font-family: var(--mono);
            font-size: 9px;
            color: var(--ink3);
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-top: 1px
        }

        .item .d {
            font-size: 10.5px;
            color: var(--ink3);
            margin-top: 2px
        }

        .nodes {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-top: 6px
        }

        .n {
            font-family: var(--mono);
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 4px;
            border: 1px solid var(--line2);
            color: var(--ink2)
        }

        .n.nsel {
            cursor: pointer
        }

        .n.nsel:hover {
            border-color: var(--sel);
            color: var(--ink)
        }

        .n.nrel {
            border-color: var(--sel);
            color: var(--ink)
        }

        .n.nactive {
            border-color: var(--sel);
            color: var(--sel);
            background: color-mix(in srgb, var(--sel) 12%, transparent)
        }

        aside {
            position: sticky;
            top: 14px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 14px;
            max-height: calc(100vh - 28px);
            overflow: auto
        }

        aside h4 {
            margin: 0 0 3px;
            font-size: 14px;
            font-weight: 600
        }

        aside .k {
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--ink3)
        }

        h5 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--ink3);
            margin: 14px 0 6px;
            font-weight: 500
        }

        dl {
            display: grid;
            grid-template-columns:auto 1fr;
            gap: 4px 10px;
            margin: 0
        }

        dt {
            color: var(--ink3);
            font-size: 11px
        }

        dd {
            margin: 0;
            font-size: 11.5px;
            word-break: break-word
        }

        dd.mono {
            font-family: var(--mono);
            font-size: 11px
        }

        .conn {
            font-size: 11.5px;
            padding: 6px 8px;
            border: 1px solid var(--line);
            border-radius: 7px;
            margin-bottom: 5px;
            cursor: pointer;
            background: none;
            width: 100%;
            text-align: left;
            color: inherit;
            font-family: inherit
        }

        .conn:hover {
            border-color: var(--sel)
        }

        .conn em {
            font-style: normal;
            color: var(--ink3);
            font-size: 10.5px;
            display: block;
            margin-top: 1px
        }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <div><h1 id="title">System Landscape</h1>
            <div class="sub" id="subtitle"></div>
        </div>
        <div class="sub">Click an element or node for details</div>
    </header>

    <div class="toolbar">
        <button id="btn-reload">Reload model</button>
        <button id="btn-wires" class="on">Draw connections</button>
        <button id="btn-clear">Clear selection</button>
        <span class="sub" id="status" style="align-self:center"></span>
    </div>

    <div id="error" style="display:none" class="err"></div>
    <div class="legend" id="legend"></div>

    <div class="layout">
        <div id="canvas">
            <svg id="wires"></svg>
            <svg id="wires-top"></svg>
            <div id="edge-band" class="band"></div>
            <div id="shared-band" class="band"></div>
            <div class="sites" id="sites"></div>
        </div>
        <aside id="panel"></aside>
    </div>
</div>

<script src="model.js"></script>
<script>
    const MODEL_URL = "model.json";
    const ZONECOLOR = {
        edge: "var(--edge)",
        network: "var(--net)",
        fw: "var(--fw)",
        dmz: "var(--dmz)",
        mgmt: "var(--mgmt)",
        backend: "var(--back)",
        storage: "var(--stor)",
        shared: "var(--shared)"
    };
    const LINKCOLOR = {
        l2: "#378ADD",
        l3: "#D85A30",
        trunk: "#1D9E75",
        app: "#7F77DD",
        repl: "#D4537E",
        wan: "#BA7517",
        dns: "#639922"
    };
    const LINKNAME = {
        l2: "L2 / Node link",
        l3: "L3 / Routing",
        trunk: "Uplink / Trunk",
        app: "Application",
        repl: "Replication",
        wan: "Site interconnect",
        dns: "DNS"
    };
    const NODEFIELDS = [["role", "Role"], ["ip", "IP address"], ["mgmt", "Management / BMC"], ["model", "Model"], ["firmware", "Firmware / BIOS"], ["os", "Operating system"], ["serial", "Serial number"], ["rack", "Rack / Location"], ["notes", "Notes"]];
    const EMPTY = {meta: {title: "System Landscape", subtitle: ""}, edge: [], shared: [], sites: [], links: []};

    let model = EMPTY, selected = null, selectedNode = null, drawWires = true;

    function esc(s) {
        return String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
    }

    function normNodes(item) {
        const list = (item.nodes || []).map(n => typeof n === "string" ? {name: n} : (n || {}));
        item.nodes = list;
        return list;
    }

    function allZones() {
        const out = [];
        (model.edge || []).forEach(z => out.push({zone: z, scope: "Edge"}));
        (model.shared || []).forEach(z => out.push({zone: z, scope: "Shared"}));
        (model.sites || []).forEach(s => (s.zones || []).forEach(z => out.push({zone: z, scope: s.name})));
        return out;
    }

    function allItems() {
        const out = [];
        allZones().forEach(({zone, scope}) => (zone.items || []).forEach(i => out.push({item: i, zone, scope})));
        return out;
    }

    function find(id) {
        return allItems().find(x => x.item.id === id);
    }

    function linksOf(id) {
        return (model.links || []).filter(l => l.from === id || l.to === id);
    }

    // links may target a single node of an element via fromNode / toNode (node name)
    function nodeLinksOf(id, name) {
        return (model.links || []).filter(l =>
            (l.from === id && l.fromNode === name) || (l.to === id && l.toNode === name));
    }

    function selectedLinks() {
        if (!selected) return [];
        if (selectedNode === null) return linksOf(selected);
        const nd = normNodes(find(selected)?.item || {})[selectedNode];
        return nd ? nodeLinksOf(selected, nd.name) : [];
    }

    function nodeIndex(itemId, name) {
        const hit = find(itemId);
        return hit && name != null ? normNodes(hit.item).findIndex(n => n.name === name) : -1;
    }

    function zoneColor(z) {
        return z.color || ZONECOLOR[z.type] || "var(--mgmt)";
    }

    async function loadModel() {
        const st = document.getElementById("status");
        const err = document.getElementById("error");
        st.textContent = "loading " + MODEL_URL + " …";
        try {
            const res = await fetch(MODEL_URL, {cache: "no-store"});
            if (!res.ok) throw new Error(res.status + " " + res.statusText);
            model = await res.json();
            err.style.display = "none";
            st.textContent = MODEL_URL + " loaded · " + new Date().toLocaleTimeString();
        } catch (e) {
            if (window.LANDSCAPE_MODEL) {
                model = structuredClone(window.LANDSCAPE_MODEL);
                st.textContent = "Fallback: model.js";
                err.style.display = "block";
                err.innerHTML = "<code>" + esc(MODEL_URL) + "</code> could not be loaded (" + esc(e.message) + ") — showing the embedded <code>model.js</code> instead. When opened via <code>file://</code> the browser blocks <code>fetch</code>; serve the page from a web server, e.g. <code>python3 -m http.server</code>.";
            } else {
                model = structuredClone(EMPTY);
                st.textContent = "";
                err.style.display = "block";
                err.innerHTML = "<code>" + esc(MODEL_URL) + "</code> could not be loaded (" + esc(e.message) + "). The file must sit next to this HTML file and be served over HTTP, e.g. <code>python3 -m http.server</code> in the same directory.";
            }
        }
        selected = null;
        selectedNode = null;
        render();
    }

    function render() {
        document.getElementById("title").textContent = model.meta?.title || "System Landscape";
        document.getElementById("subtitle").textContent = model.meta?.subtitle || "";
        document.getElementById("legend").innerHTML = allZones().map(({zone}) =>
            `<span><i class="dot" style="background:${esc(zoneColor(zone))}"></i>${esc(zone.name)}</span>`).join("");
        renderBand("edge-band", model.edge || []);
        renderBand("shared-band", model.shared || []);
        const host = document.getElementById("sites");
        host.innerHTML = "";
        for (const site of model.sites || []) {
            const sec = document.createElement("section");
            sec.className = "site";
            sec.innerHTML = `<h2>${esc(site.name)}</h2><div class="meta">${esc(site.meta || "")}</div>`;
            (site.zones || []).forEach(z => sec.appendChild(zoneEl(z)));
            host.appendChild(sec);
        }
        applySelection();
    }

    function renderBand(hostId, zones) {
        const host = document.getElementById(hostId);
        host.innerHTML = "";
        if (!zones.length) return;
        const grid = document.createElement("div");
        grid.className = "grid2";
        zones.forEach(z => grid.appendChild(zoneEl(z)));
        host.appendChild(grid);
    }

    function zoneEl(zone) {
        const col = zoneColor(zone);
        const z = document.createElement("div");
        z.className = "zone";
        z.style.borderColor = `color-mix(in srgb, ${col} 45%, transparent)`;
        z.style.background = `color-mix(in srgb, ${col} var(--tint), transparent)`;
        const head = document.createElement("h3");
        head.style.color = col;
        head.innerHTML = `<span>${esc(zone.name)}</span><span class="tag">${esc(zone.tag || "")}</span>`;
        z.appendChild(head);
        const items = document.createElement("div");
        items.className = "items";
        (zone.items || []).forEach(it => {
            const col2 = it.color || col;
            const b = document.createElement("button");
            b.className = "item";
            b.type = "button";
            b.dataset.id = it.id;
            if (it.color) b.style.borderColor = `color-mix(in srgb, ${it.color} 60%, transparent)`;
            const nodes = normNodes(it).map((n, i) =>
                `<span class="n nsel" data-item="${esc(it.id)}" data-idx="${i}" title="${esc(n.ip || "")}">${esc(n.name)}</span>`).join("");
            b.innerHTML = `<div class="t"><i class="dot" style="background:${esc(col2)}"></i>${esc(it.name)}</div>
      <div class="kind">${esc(it.kind || "")}</div>
      ${it.subtitle ? `<div class="d">${esc(it.subtitle)}</div>` : ""}
      ${nodes ? `<div class="nodes">${nodes}</div>` : ""}`;
            b.addEventListener("click", e => {
                const chip = e.target.closest(".nsel");
                if (chip) {
                    e.stopPropagation();
                    selected = chip.dataset.item;
                    selectedNode = +chip.dataset.idx;
                    applySelection();
                    return;
                }
                selected = (selected === it.id && selectedNode === null) ? null : it.id;
                selectedNode = null;
                applySelection();
            });
            items.appendChild(b);
        });
        z.appendChild(items);
        return z;
    }

    function applySelection() {
        const rel = new Set(), relNodes = new Set();
        selectedLinks().forEach(l => {
            rel.add(l.from);
            rel.add(l.to);
            if (l.fromNode != null) relNodes.add(l.from + "\n" + l.fromNode);
            if (l.toNode != null) relNodes.add(l.to + "\n" + l.toNode);
        });
        rel.delete(selected);
        document.querySelectorAll(".item").forEach(el => {
            const id = el.dataset.id;
            el.classList.toggle("sel", id === selected);
            el.classList.toggle("rel", rel.has(id));
            el.classList.toggle("dim", !!selected && id !== selected && !rel.has(id));
        });
        document.querySelectorAll(".n.nsel").forEach(el => {
            el.classList.toggle("nactive", selectedNode !== null && el.dataset.item === selected && +el.dataset.idx === selectedNode);
            el.classList.toggle("nrel", !el.classList.contains("nactive") && relNodes.has(el.dataset.item + "\n" + el.textContent));
        });
        renderPanel();
        drawLines();
    }

    function connRows(links, selfId, selfNode) {
        return links.map(l => {
            const isFrom = l.from === selfId && (selfNode === null || l.fromNode === selfNode);
            const otherId = isFrom ? l.to : l.from;
            const otherNode = isFrom ? l.toNode : l.fromNode;
            const ownNode = isFrom ? l.fromNode : l.toNode;
            const other = find(otherId);
            const dir = isBidi(l) ? "↔" : isFrom ? "→" : "←";
            const via = selfNode === null && ownNode != null ? esc(ownNode) + " " : "";
            const target = esc(other ? other.item.name : otherId) + (otherNode != null ? " / " + esc(otherNode) : "");
            return `<button class="conn" data-goto="${esc(otherId)}" data-goto-node="${nodeIndex(otherId, otherNode)}">
      <span style="display:inline-block;width:10px;height:2px;background:${LINKCOLOR[l.type] || "#888"};vertical-align:middle;margin-right:6px"></span>
      ${via}${dir} ${target}
      <em>${esc(LINKNAME[l.type] || l.type)}${l.label ? " · " + esc(l.label) : ""}${l.ports ? " · " + esc(l.ports) : ""}</em></button>`;
        }).join("") || `<div style="font-size:11.5px;color:var(--ink3)">No connections.</div>`;
    }

    function bindGoto(p) {
        p.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => {
            const idx = +b.dataset.gotoNode;
            selected = b.dataset.goto;
            selectedNode = idx >= 0 ? idx : null;
            applySelection();
        }));
    }

    function renderPanel() {
        const p = document.getElementById("panel");
        if (!selected) {
            p.innerHTML = `<h4>Overview</h4>
      <div class="k">${allItems().length} elements · ${(model.links || []).length} connections · ${allZones().length} zones</div>
      <h5>Connection types</h5>
      ${Object.keys(LINKNAME).map(t => `<div style="font-size:11.5px;display:flex;align-items:center;gap:7px;margin-bottom:4px"><i style="width:16px;height:2px;background:${LINKCOLOR[t]};display:inline-block"></i>${LINKNAME[t]}</div>`).join("")}
      <h5>Data source</h5>
      <div style="font-size:11.5px;color:var(--ink2)">All content comes from <span class="k">${esc(MODEL_URL)}</span>. Edit it there and click “Reload model”.</div>`;
            return;
        }
        const hit = find(selected);
        if (!hit) {
            p.innerHTML = `<h4>Unknown</h4><div class="k">${esc(selected)}</div>`;
            return;
        }
        const {item: it, zone, scope} = hit;

        if (selectedNode !== null) {
            const list = normNodes(it);
            const nd = list[selectedNode];
            if (!nd) {
                selectedNode = null;
                return renderPanel();
            }
            const known = NODEFIELDS.filter(([k]) => nd[k]).map(([k, l]) => `<dt>${l}</dt><dd class="mono">${esc(nd[k])}</dd>`).join("");
            const extra = Object.entries(nd).filter(([k]) => k !== "name" && !NODEFIELDS.some(f => f[0] === k))
                .map(([k, v]) => `<dt>${esc(k)}</dt><dd class="mono">${esc(v)}</dd>`).join("");
            p.innerHTML = `<button class="mini" id="n-back">← ${esc(it.name)}</button>
      <h4 style="margin-top:8px">${esc(nd.name || "Node")}</h4>
      <div class="k">node · ${esc(it.name)} · ${esc(zone.name)} · ${esc(scope)}</div>
      <h5>Properties</h5>
      ${(known || extra) ? `<dl>${known}${extra}</dl>` : `<div style="font-size:11.5px;color:var(--ink3)">No properties defined in the model.</div>`}
      <h5>Connections (${nodeLinksOf(it.id, nd.name).length})</h5>
      ${connRows(nodeLinksOf(it.id, nd.name), it.id, nd.name)}
      <h5>Nodes of this element (${list.length})</h5>
      <div class="nodes">${list.map((x, i) => `<span class="n nsel ${i === selectedNode ? "nactive" : ""}" data-item="${esc(it.id)}" data-idx="${i}">${esc(x.name || "?")}</span>`).join("")}</div>`;
            bindGoto(p);
            document.getElementById("n-back").addEventListener("click", () => {
                selectedNode = null;
                applySelection();
            });
            p.querySelectorAll(".n.nsel").forEach(el => el.addEventListener("click", () => {
                selectedNode = +el.dataset.idx;
                applySelection();
            }));
            return;
        }

        const det = Object.entries(it.details || {}).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
        const list = normNodes(it);
        const conns = connRows(linksOf(it.id), it.id, null);

        p.innerHTML = `<h4>${esc(it.name)}</h4>
    <div class="k">${esc(it.kind || "")} · ${esc(scope)} · ${esc(zone.name)} · ${esc(it.id)}</div>
    ${it.subtitle ? `<div style="font-size:12px;color:var(--ink2);margin-top:8px">${esc(it.subtitle)}</div>` : ""}
    ${det ? `<h5>Attributes</h5><dl>${det}</dl>` : ""}
    ${list.length ? `<h5>Nodes (${list.length})</h5><div class="nodes">${list.map((n, i) =>
            `<span class="n nsel" data-item="${esc(it.id)}" data-idx="${i}">${esc(n.name || "?")}</span>`).join("")}</div>` : ""}
    <h5>Connections (${linksOf(it.id).length})</h5>${conns}`;

        p.querySelectorAll(".n.nsel").forEach(el => el.addEventListener("click", () => {
            selected = el.dataset.item;
            selectedNode = +el.dataset.idx;
            applySelection();
        }));
        bindGoto(p);
    }

    function isBidi(l) {
        return l.direction === "bi";
    }

    function arrowMarker(defs, color) {
        const id = "arrow-" + color.replace(/[^a-z0-9]/gi, "");
        if (!defs.querySelector("#" + id)) {
            const m = document.createElementNS("http://www.w3.org/2000/svg", "marker");
            m.setAttribute("id", id);
            m.setAttribute("viewBox", "0 0 10 10");
            m.setAttribute("refX", "9");
            m.setAttribute("refY", "5");
            m.setAttribute("markerWidth", "7");
            m.setAttribute("markerHeight", "7");
            m.setAttribute("orient", "auto-start-reverse");
            m.innerHTML = `<path d="M 0 0 L 10 5 L 0 10 z" fill="${color}"/>`;
            defs.appendChild(m);
        }
        return `url(#${id})`;
    }

    function drawLines() {
        // element links go below the boxes (hidden where they cross other boxes),
        // node links above them so they stay visible across their own box
        const layers = ["wires", "wires-top"].map(id => document.getElementById(id));
        layers.forEach(svg => svg.innerHTML = "");
        if (!drawWires || !selected) return;
        const c = document.getElementById("canvas").getBoundingClientRect();
        const [below, above] = layers.map(svg => {
            svg.setAttribute("viewBox", `0 0 ${c.width} ${c.height}`);
            svg.setAttribute("width", c.width);
            svg.setAttribute("height", c.height);
            const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
            svg.appendChild(defs);
            return {svg, defs};
        });
        const box = (id, node) => {
            const idx = nodeIndex(id, node);
            const el = (idx >= 0 && document.querySelector(`#canvas .n[data-item="${CSS.escape(id)}"][data-idx="${idx}"]`))
                || document.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
            if (!el) return null;
            const r = el.getBoundingClientRect();
            return {l: r.left - c.left, r: r.right - c.left, t: r.top - c.top, b: r.bottom - c.top};
        };
        // anchor on the facing box edges so arrowheads stay visible:
        // side by side -> left/right edges, overlapping horizontally -> top/bottom edges
        const route = (A, B) => {
            const x = (p, q) => (Math.max(p.l, q.l) + Math.min(p.r, q.r)) / 2;
            const midY = p => (p.t + p.b) / 2;
            if (B.l > A.r || B.r < A.l) {
                const s = B.l > A.r ? 1 : -1;
                const a = {x: s > 0 ? A.r : A.l, y: midY(A)}, b = {x: s > 0 ? B.l : B.r, y: midY(B)};
                const d = Math.max(30, Math.abs(b.x - a.x) / 2) * s;
                return `M ${a.x} ${a.y} C ${a.x + d} ${a.y}, ${b.x - d} ${b.y}, ${b.x} ${b.y}`;
            }
            const cx = x(A, B), s = midY(B) > midY(A) ? 1 : -1;
            const a = {x: cx, y: s > 0 ? A.b : A.t}, b = {x: cx, y: s > 0 ? B.t : B.b};
            const d = Math.max(20, Math.abs(b.y - a.y) / 2) * s;
            return `M ${a.x} ${a.y} C ${a.x} ${a.y + d}, ${b.x} ${b.y - d}, ${b.x} ${b.y}`;
        };
        // nodes of the same element sit next to each other: arc underneath the chips
        const arc = (A, B) => {
            const a = {x: (A.l + A.r) / 2, y: A.b}, b = {x: (B.l + B.r) / 2, y: B.b};
            const d = 14 + Math.abs(b.x - a.x) / 6;
            return `M ${a.x} ${a.y} C ${a.x} ${a.y + d}, ${b.x} ${b.y + d}, ${b.x} ${b.y}`;
        };
        for (const l of selectedLinks()) {
            const A = box(l.from, l.fromNode), B = box(l.to, l.toNode);
            if (!A || !B) continue;
            const isNode = l.fromNode != null || l.toNode != null;
            const {svg, defs} = isNode ? above : below;
            const color = LINKCOLOR[l.type] || "#888";
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", l.from === l.to && l.fromNode != null && l.toNode != null ? arc(A, B) : route(A, B));
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", color);
            path.setAttribute("marker-end", arrowMarker(defs, color));
            if (isBidi(l)) path.setAttribute("marker-start", arrowMarker(defs, color));
            path.setAttribute("stroke-width", "2");
            path.setAttribute("stroke-linecap", "round");
            path.setAttribute("opacity", "0.85");
            if (l.type === "repl" || l.type === "wan") path.setAttribute("stroke-dasharray", "6 5");
            svg.appendChild(path);
        }
    }

    document.getElementById("btn-reload").addEventListener("click", loadModel);
    document.getElementById("btn-wires").addEventListener("click", e => {
        drawWires = !drawWires;
        e.currentTarget.classList.toggle("on", drawWires);
        drawLines();
    });
    document.getElementById("btn-clear").addEventListener("click", () => {
        selected = null;
        selectedNode = null;
        applySelection();
    });
    window.addEventListener("resize", drawLines);
    window.addEventListener("scroll", drawLines, {passive: true});

    loadModel();
</script>
</body>
</html>
